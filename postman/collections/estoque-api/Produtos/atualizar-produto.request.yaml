$kind: http-request
name: 'Atualizar Produto'
description: |-
  Atualiza os dados de um produto existente pelo seu ID.
  O parâmetro de rota `:id` deve ser substituído pelo identificador do produto.
method: PUT
url: '{{baseUrl}}/produtos/:id'
order: 2000
pathVariables:
  - key: id
    value: '1'
    description: Identificador único do produto a ser atualizado
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Produto Atualizado",
      "quantidade": 20,
      "preco": 49.99
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Produto atualizado com sucesso", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Resposta menciona o ID do produto", function () {
          const id = pm.request.url.variables.get("id");
          pm.expect(pm.response.text()).to.include(id);
      });
