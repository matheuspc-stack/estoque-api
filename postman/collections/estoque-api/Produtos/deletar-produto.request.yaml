$kind: http-request
name: 'Deletar Produto'
description: |-
  Remove um produto do estoque pelo seu ID.
  O parâmetro de rota `:id` deve ser substituído pelo identificador do produto a ser removido.
method: DELETE
url: '{{baseUrl}}/produtos/:id'
order: 3000
pathVariables:
  - key: id
    value: '1'
    description: Identificador único do produto a ser deletado
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Produto deletado com sucesso", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Resposta menciona o ID do produto", function () {
          const id = pm.request.url.variables.get("id");
          pm.expect(pm.response.text()).to.include(id);
      });
